<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Reset password | The Sifted Cafe</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#f7efdd">
  <link rel="icon" type="image/png" href="assets/favicon.png">
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Geist:wght@100..900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="auth-page">
  <header class="site-header">
    <div class="container header-inner">
      <a class="brand" href="index.html" aria-label="The Sifted Cafe, home">
        <img src="assets/logo-wordmark.png" alt="the sifted" width="700" height="186">
        <span class="brand-tag">cafe &amp; bakery</span>
      </a>
      <a class="back-home" href="index.html" aria-label="Back to the home page">
        <span class="back-home-icon" aria-hidden="true"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" focusable="false"><path d="M19 12H5M12 19l-7-7 7-7"/></svg></span>
        <span class="back-home-long">Back to home</span>
      </a>
    </div>
  </header>

  <main id="main" class="auth-main">
    <aside class="auth-photo on-dark" aria-hidden="true">
      <img src="assets/img/auth-login.jpg" alt="" width="900" height="1200">
      <p class="auth-photo-kicker">Cafe &amp; bakery &middot; Calamba &middot; Cabuyao</p>
      <p class="auth-photo-text">We sift out the rush and <em>keep the good moments.</em></p>
    </aside>
    <section class="auth-card" aria-labelledby="auth-title">
      <span class="eyebrow eyebrow-rule">Account help</span>
      <h1 id="auth-title">Forgot password?</h1>
      <p class="auth-intro">Type the email you registered with. We will email you a secure link to choose a new password.</p>
      <div id="auth-status" class="form-status" aria-live="polite"></div>
      <form id="reset-form" class="auth-form" novalidate>
        <div class="field">
          <label for="reset-email">Email</label>
          <input id="reset-email" type="email" autocomplete="email" required inputmode="email" aria-describedby="err-reset-email" placeholder="The email you signed up with">
          <p class="field-error" id="err-reset-email" aria-live="polite"></p>
        </div>
        <button type="submit" class="btn btn-primary btn-block" id="reset-submit">Send reset link</button>
      </form>
      <p class="auth-switch">Remembered it? <a href="login.html">Log in</a></p>
    </section>
  </main>

  <script src="js/config.js"></script>
  <script src="js/shared.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/forgot.js"></script>
  <script src="js/faq.js" defer></script>
</body>
</html>
